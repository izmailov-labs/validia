# Linux scenarios that a CI runner cannot reproduce.
#
#   make test-docker              every scenario
#   make test-docker-one S=musl   one of them
#
# The repo is mounted rather than copied, so a run needs no rebuild. The virtual
# environment lives outside the mount because the host's is macOS or Windows.
#
# Commands are single-line on purpose: a folded YAML scalar silently broke
# `--basetemp` onto its own line here, and `sh` reported it as a missing command.

x-build: &build
  context: ..
  dockerfile: docker/Dockerfile

x-common: &common
  build: *build
  volumes:
    - ..:/repo
  working_dir: /repo
  # `--no-cov`: coverage is measured once, on the host.
  command: ["sh", "-c", "uv sync --locked --group dev --quiet && uv run pytest -q --no-cov -p no:cacheprovider"]

services:
  # 1. glibc, the baseline, to prove the harness itself works.
  glibc:
    <<: *common

  # 2. musl. A different libc, and where a wheel that only ships manylinux is
  #    discovered the hard way.
  musl:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BASE: python:3.12-alpine

  # 3. A genuinely hostile encoding environment. LANG=C alone is not enough:
  #    these images enable UTF-8 mode, which overrides the locale and makes the
  #    scenario pass vacuously. PYTHONUTF8=0 is what actually yields ASCII, and
  #    the guard below fails loudly if that ever stops being true.
  posix-locale:
    <<: *common
    environment:
      LANG: C
      LC_ALL: POSIX
      PYTHONUTF8: "0"
      PYTHONWARNDEFAULTENCODING: "1"
    command: ["sh", "-c", "uv sync --locked --group dev --quiet && uv run python -c \"import sys; enc = sys.getdefaultencoding(); fs = sys.getfilesystemencoding(); print('utf8_mode', sys.flags.utf8_mode, '| fsencoding', fs); assert fs == 'ascii', 'scenario is vacuous: expected ascii, got ' + fs\" && uv run pytest -q --no-cov -p no:cacheprovider -W error::EncodingWarning"]

  # 4. Real Docker secrets: a read-only tmpfs at /run/secrets, one file per key,
  #    which is the shape SecretsDirSource exists for.
  secrets:
    <<: *common
    environment:
      WHENCE_CONTAINER: "1"
    secrets:
      - db.password
      - api.token
    command: ["sh", "-c", "uv sync --locked --group dev --quiet && uv run pytest -q --no-cov -p no:cacheprovider -m container -rs"]

  # 5. A read-only root and a read-only repo. Configuration is read, never
  #    written, and this proves it. The environment gets a named volume rather
  #    than tmpfs: a tmpfs mount is noexec here, so the interpreter in it cannot
  #    be spawned at all.
  readonly-root:
    build: *build
    read_only: true
    working_dir: /repo
    volumes:
      - ..:/repo:ro
      - readonly-venv:/opt/venv
    tmpfs:
      - /tmp
    command: ["sh", "-c", "uv sync --locked --group dev --quiet && uv run pytest -q --no-cov -p no:cacheprovider --basetemp=/tmp/pytest libs/whence"]

  # 6. An unprivileged user, as every sane deployment runs.
  nonroot:
    <<: *common
    user: "1000:1000"
    environment:
      HOME: /tmp
      UV_PROJECT_ENVIRONMENT: /tmp/venv
      UV_CACHE_DIR: /tmp/uv-cache

volumes:
  readonly-venv:

secrets:
  db.password:
    file: ./secrets/db.password
  api.token:
    file: ./secrets/api.token
