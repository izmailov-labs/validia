# Whole prompts for output, as every model sees them: each names exactly the rules that
# must fire on it.

released = "2026-10-07"
changes = ["First release."]

[[examples]]
name = "output, before"
fires = ["format-ban", "json-in-prose", "hold-progress"]
text = '''Output ONLY valid JSON. Never use bullet points.
Hold all findings for the final response.'''

[[examples]]
name = "output, after"
fires = []
text = '''Replies are read on a phone, so answer only what was asked. Use a numbered list when the
customer has to follow steps in order; otherwise write short paragraphs. When you start
a lookup that takes a while, tell the customer what you are checking.
Record the outcome with the record_outcome tool.'''
