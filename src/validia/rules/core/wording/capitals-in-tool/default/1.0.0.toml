# wording/capitals-in-tool, for every model.

released = "2026-10-07"
changes = ["First release."]

title = "Steering in capitals in a tool description"
pattern = '\b(MUST|ALWAYS|NEVER|CRITICAL|IMPORTANT)\b'
scope = ["tool_description"]
case_sensitive = true
fix = "Describe when the tool applies; steering in capitals makes models overcall it."
