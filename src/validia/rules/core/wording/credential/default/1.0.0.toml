# wording/credential, for every model.

released = "2026-10-07"
changes = ["First release."]

title = "A credential in the prompt"
pattern = '\bsk-(ant-)?[A-Za-z0-9_-]{20,}|\bAKIA[0-9A-Z]{16}\b|-----BEGIN [A-Z ]*PRIVATE KEY-----|\bgh[pousr]_[A-Za-z0-9]{36,}|\bgithub_pat_[A-Za-z0-9_]{22,}|\bxox[abprs]-[A-Za-z0-9-]{10,}|\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
case_sensitive = true
severity = "error"
confidence = "high"
fix = "Remove the secret: prompts leak (OWASP LLM07). Pass credentials to tools in code, never in text the model reads."
