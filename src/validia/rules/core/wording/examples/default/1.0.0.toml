# Whole prompts for wording, as every model sees them: each names exactly the rules that
# must fire on it, and how severe each must be when it says so.

released = "2026-10-07"
changes = ["First release."]

[[examples]]
name = "wording, before"
fires = ["capitals", "exclamation-marks", "credential", "expired-date", "old-model-name", "length-cap", "unwrapped-input"]
counts = { "capitals" = 3 }
text = '''IMPORTANT: You MUST ALWAYS be polite!!
Use sk-test-000000000000000000000000 for the orders API.
As of 2025-03, damaged items count as late. Unlike Claude 3.5 Sonnet, answer in at most 50 words.
Customer message: {message}'''

[[examples]]
name = "wording, after"
fires = []
text = '''Customers read these replies on their phones, so write in plain, friendly language.
The orders tool holds its own credentials. Damaged items count as late.
Keep each reply to a short paragraph.
<message>{message}</message>'''
