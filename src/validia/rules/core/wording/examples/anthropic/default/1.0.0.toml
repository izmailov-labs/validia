# Whole prompts for wording, as anthropic/default sees them: each names exactly the rules that
# must fire on it, and how severe each must be when it says so.

released = "2026-10-07"
changes = ["First release."]

[[examples]]
name = "capitals on Opus 5"
model = "claude-opus-5"
fires = { "capitals" = "warn", "exclamation-marks" = "warn" }
text = "Reply in English!! That is IMPORTANT, because the support team reads every reply."

[[examples]]
