[project]
name = "validia"
version = "0.1.0"
description = "A universal, async-first evaluation framework for LLM systems: prompts, tools, and agents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "izmailov-labs" }]
keywords = ["llm", "evaluation", "evals", "prompts", "agents", "benchmarking", "async"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
# Runtime dependencies are inherited by every consumer of this library.
# Keep this list empty unless there is no reasonable stdlib alternative.
dependencies = []

[project.urls]
Homepage = "https://validia.dev"
Documentation = "https://validia.dev"
Repository = "https://github.com/izmailov-labs/validia"
Changelog = "https://github.com/izmailov-labs/validia/blob/main/libs/validia/CHANGELOG.md"
Issues = "https://github.com/izmailov-labs/validia/issues"

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/validia"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "CHANGELOG.md", "README.md", "LICENSE"]

# Lint, type, test and coverage configuration is deliberately absent here: it
# lives once in the workspace root so every package is held to the same gate.
