[project]
name = "whence"
version = "0.1.0"
description = "Typed configuration that remembers where it came from: layered async loading with full provenance."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "izmailov-labs" }]
keywords = ["configuration", "settings", "config", "env", "dotenv", "provenance", "async"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
# An empty list is the product claim, not a preference: the core loads env vars,
# .env, TOML, JSON, .properties and XML on the standard library alone. YAML is
# the single exception and lives behind an extra.
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0.2"]

[project.scripts]
whence = "whence.cli:main"

[project.urls]
Homepage = "https://validia.dev"
Documentation = "https://validia.dev"
Repository = "https://github.com/izmailov-labs/validia"
Changelog = "https://github.com/izmailov-labs/validia/blob/main/libs/whence/CHANGELOG.md"
Issues = "https://github.com/izmailov-labs/validia/issues"

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whence"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "CHANGELOG.md", "README.md", "LICENSE"]

# Lint, type, test and coverage configuration is deliberately absent here: it
# lives once in the workspace root so every package is held to the same gate.
