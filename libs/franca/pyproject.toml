[project]
name = "franca"
version = "0.1.0"
description = "One request shape for every LLM wire dialect: transports, adapters, streaming, and a model registry."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "izmailov-labs" }]
keywords = ["llm", "api-client", "adapters", "anthropic", "openai", "gemini", "streaming", "async"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
# pydantic is franca's ONE runtime dependency, and adding it was a real decision
# (plan SS11). The stdlib route -- a reflective validator, dict profile rows, a custom
# Secret -- is Any-heavy code owned forever, and dataclasses validate nothing on the
# outbound request, so request errors would carry no field path. pydantic gives
# exclude_unset overlay semantics, extra="allow" with alias generators, SecretStr and
# Field(exclude=True) in a line each. Every LLM SDK consumers already install depends
# on pydantic 2, so the inherited weight is near zero.
#   >=2.12  first release with Python 3.14 support (CI runs 3.14), and the first where
#           validate_by_name / validate_by_alias are the non-deprecated spelling.
#   <3      v3 changes defaults.
# httpx stays undeclared until transports/httpx.py exists; it lands as the optional
# `franca[http]` extra, imported lazily inside HttpxTransport.__init__.
dependencies = ["pydantic>=2.12,<3", "whence>=0.1"]

# whence is the workspace's configuration layer: layered loading from TOML and the
# environment, with every value keeping the file and line it came from so a bad
# setting reports `franca.toml:4:9` rather than just a field name. It carries no
# runtime dependencies of its own, so the inherited weight is the package itself.
[tool.uv.sources]
whence = { workspace = true }

# httpx is NOT a runtime dependency: `HttpxTransport` imports it inside __init__ and
# raises ConfigError("pip install 'franca[http]'") when it is absent, so the library
# installs and every offline path (ScriptedTransport, cassettes) works without it.
[project.optional-dependencies]
http = ["httpx>=0.28"]

[project.urls]
Homepage = "https://github.com/izmailov-labs/validia/tree/main/libs/franca"
Repository = "https://github.com/izmailov-labs/validia"
Changelog = "https://github.com/izmailov-labs/validia/blob/main/libs/franca/CHANGELOG.md"
Issues = "https://github.com/izmailov-labs/validia/issues"

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/franca"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "CHANGELOG.md", "README.md", "LICENSE"]

# Lint, type, test and coverage configuration is deliberately absent here: it
# lives once in the workspace root so every package is held to the same gate.
