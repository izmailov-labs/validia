name: CI

on:
  push:
    branches: [main]
  pull_request:

# astral-sh/setup-uv publishes immutable releases and no longer moves major tags,
# so every action below is pinned to a full commit SHA with a version comment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        # Full version sweep on Linux, and both ends of the range on macOS and
        # Windows. The floor catches what has always been broken there; the
        # ceiling catches what a new release breaks. One point is not enough for
        # a workspace whose configuration layer reads the filesystem and the
        # environment, where the three platforms genuinely disagree.
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.12" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.12" }
          - { os: windows-latest, python: "3.14" }
          # 3.15.0 lands 2026-10-01; promote to a required job once it ships.
          - { os: ubuntu-latest, python: "3.15", experimental: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      # A short basetemp on Windows: pytest builds tmp_path from the test's own
      # name, and the default root plus a long name can cross MAX_PATH.
      - run: uv run pytest --cov --cov-report=term-missing
        if: runner.os != 'Windows'
      - run: uv run pytest --cov --cov-report=term-missing --basetemp=D:\t
        if: runner.os == 'Windows'

  encoding:
    # Any open() or read_text() missing an explicit `encoding=` becomes an error.
    # Without this the failure only appears on a Windows runner, where the
    # default is a code page rather than UTF-8, and only for non-ASCII content.
    runs-on: ubuntu-latest
    env:
      PYTHONWARNDEFAULTENCODING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest -q -W error::EncodingWarning --no-cov

  minimums:
    # Verifies the declared dependency floors actually resolve and pass, rather
    # than only ever being tested at their latest versions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --resolution lowest-direct --group dev
      - run: uv run pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group docs
      - run: uv run mkdocs build --strict

  build:
    # Catches broken packaging before it can reach a release tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # Every workspace member is built, so a packaging break in any of them
      # fails here rather than at its release tag.
      - run: uv build --all-packages --out-dir dist
      - run: uvx twine check dist/*
      # Both checks iterate the wheels rather than naming a package, so a new
      # workspace member is covered the moment it exists.
      - name: PEP 561 marker is present in every wheel
        run: |
          for whl in dist/*.whl; do
            pkg="$(basename "$whl" | cut -d- -f1)"
            unzip -l "$whl" | grep -q "$pkg/py.typed" \
              || { echo "::error::$whl ships no $pkg/py.typed"; exit 1; }
          done
      - name: Installed wheels import cleanly
        run: |
          for whl in dist/*.whl; do
            pkg="$(basename "$whl" | cut -d- -f1)"
            uv run --isolated --no-project --with "$whl" \
              python -c "import $pkg; print($pkg.__name__, $pkg.__version__)"
          done
