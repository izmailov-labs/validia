name: Release

# Tags are package-scoped because this repository is a workspace: every member
# under libs/ has its own version and releases on its own cadence.
# Format: <package>-v<version>, e.g. validia-v0.1.0
on:
  push:
    tags: ["*-v*"]

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse the tag and match it against the member's pyproject.toml
        id: parse
        run: |
          tag="$GITHUB_REF_NAME"
          package="${tag%-v*}"
          version="${tag##*-v}"
          manifest="libs/$package/pyproject.toml"
          if [ ! -f "$manifest" ]; then
            echo "::error::tag $tag names package '$package', but $manifest does not exist"
            exit 1
          fi
          declared="$(python -c "import tomllib,pathlib,sys; print(tomllib.loads(pathlib.Path(sys.argv[1]).read_text())['project']['version'])" "$manifest")"
          if [ "$version" != "$declared" ]; then
            echo "::error::tag version $version does not match $manifest version $declared"
            exit 1
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: meta
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.meta.outputs.package }}
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC) — no API token needed
      contents: write # creating the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Only the tagged member is built and published: a sibling package must
      # never be shipped as a side effect of someone else's release.
      - run: uv build --package "${{ needs.meta.outputs.package }}" --out-dir dist
      - run: uvx twine check dist/*

      # PyPI rejects new files added to a release older than 14 days, so every
      # artifact for a version has to be published here in one shot.
      # Sigstore attestations are generated by default under trusted publishing.
      # Each package needs its own PyPI project and its own trusted publisher,
      # configured before its first tag.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
