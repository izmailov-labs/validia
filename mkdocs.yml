site_name: validia
site_description: "A universal, async-first evaluation framework for LLM systems: prompts, tools, and agents."
site_url: https://validia.dev
repo_url: https://github.com/izmailov-labs/validia
repo_name: izmailov-labs/validia
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 izmailov-labs

# docs/research/ holds internal working notes, not published documentation, and
# docs/_hooks/ the build's own code.
exclude_docs: |
  research/
  _hooks/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# The API reference is generated from docstrings in src/, so `mkdocs serve`
# must watch it too - otherwise edits there don't trigger a rebuild.
watch:
  - src

# The tables on docs/rules/ are generated from the installed package at build time, with
# a release dropdown per category.
hooks:
  - docs/_hooks/rules_catalog.py

extra_css:
  - stylesheets/rules.css

extra_javascript:
  - javascripts/rules-releases.js

# A page missing from the nav fails --strict: the hook already fails it for a rules
# target with no page, and this keeps every such page reachable.
validation:
  nav:
    omitted_files: warn

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Prompt rules:
      - rules/index.md
      - rules/default.md
      - Anthropic:
          - rules/anthropic/index.md
          - rules/anthropic/claude-fable-5-1.md
          - rules/anthropic/claude-opus-5.md
          - rules/anthropic/claude-opus-5-5.md
          - rules/anthropic/claude-sonnet-5-5.md
      - rules/google/index.md
      - rules/openai/index.md
      - Rule versions: rules/releases.md
      - rules/custom.md
  - API reference: api.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
  - toc:
      permalink: true
